# Build and test on every push and pull request: gofmt, vet, staticcheck,
# govulncheck, unit tests with the race detector, frontend syntax and
# budget checks, shell syntax of the deploy scripts.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04 # pinned: shellcheck comes from the runner's Ubuntu archive
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: go test (race)
        run: go test -race -count=1 ./...
      - name: static build (the release artefact shape)
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/n5-fangov ./cmd/n5-fangov && /tmp/n5-fangov version
      - name: frontend syntax
        run: node --check internal/web/static/app.js
      - name: deploy scripts
        run: bash -n deploy/install.sh deploy/uninstall.sh deploy/n5-fangov-onfailure && sudo apt-get install -y -q shellcheck >/dev/null && shellcheck -S warning deploy/install.sh deploy/uninstall.sh deploy/n5-fangov-onfailure
      - name: unit file
        run: systemd-analyze verify deploy/n5-fangov.service deploy/n5-fangov-onfailure.service || true
