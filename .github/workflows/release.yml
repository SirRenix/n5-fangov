# Release on every tag v*: build the static linux/amd64 binary from the tag,
# run the tests, package the .deb, and publish a GitHub release with the
# binary, its sha256 and the package. A hyphen in the tag (v0.3.0-beta.5,
# v1.0.0-rc1) marks a pre-release. Release notes come from CHANGELOG.md
# (the section for the version) when present, else from the tag message.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-24.04 # pinned: dpkg-deb comes from the runner image
    timeout-minutes: 20
    permissions:
      contents: write   # create the release and upload assets — nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "$ver" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: test
        run: go vet ./... && go test -count=1 ./...
      - name: build
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/SirRenix/n5-fangov/internal/version.Version=$VER" \
            -o "dist/n5-fangov-$VER-linux-amd64" ./cmd/n5-fangov
          cp "dist/n5-fangov-$VER-linux-amd64" dist/n5-fangov
          "dist/n5-fangov" version
          (cd dist && sha256sum "n5-fangov-$VER-linux-amd64" > "n5-fangov-$VER-linux-amd64.sha256")
      # One release, one binary: package the file built above (deb-only never rebuilds)
      # and prove that the .deb carries exactly the uploaded asset.
      - name: deb
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          make deb-only VERSION="$VER" && ls -la dist/*.deb
          mkdir -p /tmp/debchk && dpkg-deb -x dist/*.deb /tmp/debchk
          asset=$(sha256sum "dist/n5-fangov-$VER-linux-amd64" | cut -d' ' -f1)
          indeb=$(sha256sum /tmp/debchk/usr/bin/n5-fangov | cut -d' ' -f1)
          [ "$asset" = "$indeb" ] || { echo "::error::.deb binary ($indeb) differs from the release asset ($asset)"; exit 1; }
          dpkg-deb -I dist/*.deb | grep -E '^ (Package|Version):'
          dpkg-deb --ctrl-tarfile dist/*.deb | tar -tf - | grep -q './md5sums' || { echo "::error::md5sums missing"; exit 1; }
          case "$(/tmp/debchk/usr/bin/n5-fangov version)" in "n5-fangov $VER") ;; *) echo "::error::version literal carries a prefix: $(/tmp/debchk/usr/bin/n5-fangov version)"; exit 1;; esac
      - name: release notes
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ] && grep -q "^## \[\?$VER" CHANGELOG.md; then
            awk -v v="$VER" '
              index($0, "## [" v) == 1 || index($0, "## " v) == 1 { on=1; next }
              on && /^## / { exit }
              on && /^### / { exit }
              on { print }' CHANGELOG.md > notes.md
            # the section's summary only (everything before its first ### heading); the details stay in CHANGELOG.md
            printf '\nFull list of changes: [CHANGELOG.md](https://github.com/SirRenix/n5-fangov/blob/%s/CHANGELOG.md)\n' "${GITHUB_REF_NAME}" >> notes.md
          else
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          fi
          printf '\n---\nStatic linux/amd64 binary (`CGO_ENABLED=0`, `-trimpath`), built from tag `%s` by GitHub Actions; verify with `sha256sum -c`.\n' "${GITHUB_REF_NAME}" >> notes.md
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.version }}
          PRE: ${{ steps.v.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRE" = "true" ] && flags="--prerelease"
          gh release create "$TAG" $flags --title "$TAG" --notes-file notes.md \
            "dist/n5-fangov-$VER-linux-amd64" "dist/n5-fangov-$VER-linux-amd64.sha256" dist/*.deb
