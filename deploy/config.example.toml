# n5-fangov configuration — /etc/n5-fangov/config.toml
#
# Invalid values never prevent start: each bad field falls back to its
# built-in default with a warning in the journal and a "config" alert.
# A channel whose sensor cannot be read (e.g. drivetemp:max without any
# SATA drive) is held at its safe duty -- the fixed stop duty if one is
# configured, else 255 -- in mode "sensor-error" while the other channels
# keep regulating; one "sensor" alert names the channel.
# Values below are the Minisforum N5 Pro set measured on 14.09.2026
# (duty -> RPM: CPU 85->2000 140->3120 255->5073; SSD 74->2130 255->4687;
#  HDD 87->1237 105->1650 140->2250 179->2725 255->3540).

[daemon]
interval = "10s"        # regulation cycle, 2s..30s (larger values are clamped to 30s: the unit runs with WatchdogSec=60 and two cycles must fit)
step_up = 40            # max duty increase per cycle (1..255)
step_down = 15          # max duty decrease per cycle (1..255)
stall_min_duty = 60     # RPM 0 at or above this duty counts as a stall (1..255)
stall_cycles = 2        # ... after this many consecutive cycles (1..20)
stale_cycles = 18       # first channel's sensor bit-identical this many cycles -> frozen (6..600); only checked when that sensor is k10temp
alert_cooldown = "30m"  # minimum gap between alerts of the same kind (60s..24h)
log_every = 30          # status line every N cycles (0 = never)
emergency = false       # run the emergency hook /etc/n5-fangov/emergency.sh (a root-owned executable you install
                        # by hand -- the daemon never writes it, no API can) when a channel stays at its ceiling for
                        # emergency_cycles cycles with a stalled fan, or 3x as long regardless of RPM; once per
                        # episode, 60 s bound, output in the log, alert "emergency" with the exit status. false =
                        # off (the "ceiling" alert still goes out). Template with the env vars:
                        # /usr/share/doc/n5-fangov/examples/emergency.example.sh (logger line; commented poweroff)
emergency_cycles = 6    # consecutive cycles at the ceiling before the action (1..60; x3 for the no-RPM rule)
profile = "auto"        # auto | n5pro | nct67xx | it87xx | monitor

[web]
listen = "127.0.0.1:8010"
auth = "none"           # none | basic
user = ""
password_hash = ""      # written by `n5-fangov passwd`: pbkdf2$<iter>$<salt>$<key> (PBKDF2-HMAC-SHA256);
                        # the older sha256 hex of "user:password" is still accepted
allowed_hosts = []      # extra Host header names to serve, e.g. the name a reverse proxy passes
                        # through: ["fans.example.internal"]. IP literals, "localhost" and the
                        # listen host always pass; anything else gets 421 (DNS-rebinding guard).
                        # "*" disables the check. Changes need a restart, like all of [web].
tls = "off"             # auto | off | file. Default: "off" on a loopback listen, "auto" elsewhere.
                        # auto = self-signed certificate in /etc/n5-fangov/tls (download and trust it from the dashboard or: n5-fangov cert export).
                        # A non-loopback listen with "off" is forced to "auto": LAN traffic is never plain HTTP.
cert_file = ""          # tls = "file": PEM certificate (chain); the dashboard upload sets these two to /etc/n5-fangov/tls/custom-*.pem
key_file = ""           # tls = "file": PEM private key
behind_tls_proxy = false # true when this (plain-HTTP, loopback) listener is only reached through a
                        # TLS-terminating reverse proxy: the session cookie is then marked Secure so a
                        # browser never sends it over plain HTTP. Not needed with tls = "auto"/"file".

[log]
file = "/var/log/n5-fangov/n5-fangov.log"   # rotating log file in addition to the journal; "" = journal only.
                        # Must be a plain absolute path under /var/log/ (no ".."); an existing target
                        # that is not a regular file (symlink, device) is refused
max_size_mb = 5         # rotate above this size (1..100); rotated files: .1 .. .N
max_files = 5           # rotated files to keep (1..20)

[alert]
transport = "auto"      # auto | pve | mail | webhook | log | off
                        # auto = PVE::Notify (Proxmox notification stack, template "n5-fangov") when present,
                        #        else mail(1) to mail_to, else the journal only.
                        # pve/mail without the tool degrade in the same order; off = journal line only.
                        # webhook is never chosen by auto; without a usable webhook_url it falls back to auto + warning.
                        # Changed live from the dashboard's Alerts tab (or by editing here + PUT /api/config).
mail_to = "root"        # mail transport only: local user or address, no spaces
# webhook_url = "https://ntfy.example.test/n5"
                        # webhook transport only: absolute http(s) URL with a host, no user:pass@, <= 2048 chars;
                        # one POST per alert, 2xx = delivered, redirects not followed, system CA pool (no insecure
                        # switch). ntfy: topic in the path; Gotify: /message?token=<app token> (the query is redacted
                        # in logs and "alerts status"); Home Assistant: /api/webhook/<id>.
# webhook_format = "json"
                        # json (default): {"type":"n5-fangov","kind":..,"severity":"warning","hostname":..,"title":..,"message":..,"ts":..}
                        # text: the alert text as text/plain. Headers on both: X-N5-Fangov-Kind, Title (ntfy reads it).

[dashboard]
sensors = []            # extra sensors charted on the Overview, 0..8 ids of the same forms as channel sensors,
                        # e.g. ["hwmon:amdgpu:temp1", "ec:system"]. Never influence regulation; an id without a
                        # device is kept and charted once the device appears. The Sensors card toggles these.

# CPU fan (pwm1) <- k10temp Tctl. EC idle duty was 85.
[[channel]]
name = "cpu"            # unique, [a-z0-9_]{1,32}
pwm = 1                 # pwmN of the profile's hwmon device (1..8)
sensor = "k10temp"      # k10temp | coretemp | nvme:max | drivetemp:max | disk:<dev> | hwmon:<name>:tempN | ec:<label>
                        # or an array of 1..4 ids = the maximum of them: ["drivetemp:max", "ec:hdd"]
                        # (stored as "drivetemp:max,ec:hdd"; a part whose device is absent is skipped)
curve = [[45, 85], [80, 255]]   # [temp_c, duty] points, ascending temp, 2..8 points, linear between
critical = 88           # temp -> 255 immediately, no slew, even under manual override (judged on the raw reading)
# ceiling = 90          # optional: LOWER the built-in ceiling of this sensor kind (CPU 100, SSD 85, HDD 65 C; a composite
                        # takes the lowest of its parts). At/above the ceiling the channel goes to 255 whatever the curve,
                        # override, hysteresis, min_on or critical say, until it is 3 C below; alert "ceiling". A value
                        # above the built-in ceiling (or below 30) is a warning and the built-in one stays -- the key can
                        # only lower it. A critical above the ceiling is accepted; `n5-fangov check` warns that the
                        # ceiling acts first.
stop = "auto"           # "auto" = hand the channel back to the EC/BIOS on stop, or a fixed duty 60..255 (n5pro pwm3: never "auto", forced to 140)
hysteresis = 0          # 0..10 degrees C, integer; 0 = off. The curve follows a held temperature that moves only when the
                        # reading differs from it by >= this many degrees. Reload, no restart.
min_on = "0s"           # 0s..1h; 0s = off. A rise of the curve target is held for at least this long before the
                        # curve may lower it again (a further rise restarts the timer). Reload, no restart.

# SSD fan (pwm2) <- max NVMe composite (SN700 warns at 84 C); idle 44-46 C, EC idle 74.
[[channel]]
name = "ssd"
pwm = 2
sensor = "nvme:max"
curve = [[48, 74], [65, 255]]
critical = 72
stop = "auto"

# HDD group (pwm3) <- max drivetemp (WD: critical 60 C). Deliberately sharper than the EC:
# rises from 36 C, 40 C -> ~165 (~2600 RPM), 46 C -> full. Goal: disks <= 39 C.
# stop = 140: the EC no longer regulates this channel after the first manual write
# (measured 14.09.2026), so "auto" would leave the disks at whatever duty was last set.
[[channel]]
name = "hdd"
pwm = 3
sensor = "drivetemp:max"
curve = [[36, 105], [46, 255]]
critical = 56
stop = 140
hysteresis = 2          # drive temperatures move slowly: step the curve in 2 C steps instead of toggling at 44/45 C
min_on = "60s"          # ... and keep a step-up for a minute so the disks actually cool before the fan drops

# PCIe fan header (pwm4), OPTIONAL fourth channel on the N5 Pro: no tachometer (rpm = -1, never in the
# stall check). The daemon neither adds nor corrects it; the built-in presets do not name it and an
# apply keeps it (merge by pwm). The EC does NOT take pwm4 back after a write (measured 2026-09-17:
# idle state enable 2, duty 255, 0 RPM; after a manual duty and enable 2 again the duty stayed), so
# stop = "auto" leaves the last duty in place -- a fixed stop gives a defined state. Adding it needs
# a restart (changed channel set).
# [[channel]]
# name = "pcie"
# pwm = 4
# sensor = "k10temp"
# curve = [[45, 85], [80, 255]]
# critical = 88
# stop = 140

# Preset schedules: switch presets by time of day (host local time). At most 16 entries; an entry
# without from/to is the fallback (at most one) and applies whenever no window matches. The
# scheduler acts on transitions only -- a manual apply or curve edit inside a window stays until the
# next switch. A failed switch keeps the previous curves and raises the "schedule" alert. The
# preset must exist when the switch happens (not checked when the file is read). Reload, no restart.
# [[schedule]]
# preset = "n5pro-quiet"          # [a-z0-9_-]{1,64}
# from = "22:00"                  # HH:MM, both or neither; to < from = the window crosses midnight
# to = "07:00"
# days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]   # optional subset; missing = every day
#
# [[schedule]]
# preset = "n5pro-balanced"       # no from/to: the fallback
