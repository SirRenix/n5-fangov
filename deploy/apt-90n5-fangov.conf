// n5-fangov kernel gate: after every dpkg run check that the DKMS fan driver
// module exists for every installed kernel (n5pro profile). A missing module
// is printed here and sent as a "kernel" alert; it never fails the apt run.
// Installed as /etc/apt/apt.conf.d/90n5-fangov by install.sh / the deb postinst.
DPkg::Post-Invoke { "if [ -x /usr/bin/n5-fangov ]; then /usr/bin/n5-fangov check --after-update || true; fi"; };
